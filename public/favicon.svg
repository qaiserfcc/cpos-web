<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="posGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#posGradient)" stroke="#ffffff" stroke-width="1"/>

  <!-- POS Terminal Body -->
  <rect x="6" y="8" width="20" height="16" rx="2" fill="#2a2a2a" stroke="#ffffff" stroke-width="0.5"/>

  <!-- Screen -->
  <rect x="8" y="10" width="16" height="8" rx="1" fill="url(#screenGradient)"/>
  <rect x="8" y="10" width="16" height="8" rx="1" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>

  <!-- Receipt lines on screen -->
  <line x1="10" y1="12" x2="22" y2="12" stroke="#0066ff" stroke-width="1"/>
  <line x1="10" y1="14" x2="20" y2="14" stroke="#0066ff" stroke-width="1"/>
  <line x1="10" y1="16" x2="18" y2="16" stroke="#0066ff" stroke-width="1"/>

  <!-- Amount/total line -->
  <line x1="16" y1="17" x2="22" y2="17" stroke="#ff6b35" stroke-width="1.5"/>

  <!-- Card reader slot -->
  <rect x="12" y="20" width="8" height="2" rx="0.5" fill="#666666"/>
  <rect x="13" y="20.5" width="6" height="1" rx="0.3" fill="#999999"/>

  <!-- Shopping cart icon in corner -->
  <g transform="translate(22, 6)">
    <!-- Cart body -->
    <rect x="0" y="2" width="4" height="3" rx="0.3" fill="#ffffff"/>
    <!-- Cart wheels -->
    <circle cx="1" cy="6" r="0.5" fill="#ffffff"/>
    <circle cx="3" cy="6" r="0.5" fill="#ffffff"/>
    <!-- Cart handle -->
    <line x1="0" y1="2" x2="2" y2="0" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="4" y1="2" x2="2" y2="0" stroke="#ffffff" stroke-width="0.8"/>
  </g>
</svg>