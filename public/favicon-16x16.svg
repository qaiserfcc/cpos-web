<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <linearGradient id="posGradientSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradientSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="8" cy="8" r="7.5" fill="url(#posGradientSmall)" stroke="#ffffff" stroke-width="0.5"/>

  <!-- POS Terminal Body -->
  <rect x="3" y="4" width="10" height="8" rx="1" fill="#2a2a2a" stroke="#ffffff" stroke-width="0.3"/>

  <!-- Screen -->
  <rect x="4" y="5" width="8" height="4" rx="0.5" fill="url(#screenGradientSmall)"/>
  <rect x="4" y="5" width="8" height="4" rx="0.5" fill="none" stroke="#e0e0e0" stroke-width="0.3"/>

  <!-- Receipt lines -->
  <line x1="5" y1="6" x2="11" y2="6" stroke="#0066ff" stroke-width="0.5"/>
  <line x1="5" y1="7" x2="10" y2="7" stroke="#0066ff" stroke-width="0.5"/>
  <line x1="5" y1="8" x2="9" y2="8" stroke="#0066ff" stroke-width="0.5"/>

  <!-- Card reader -->
  <rect x="6" y="10" width="4" height="1" rx="0.3" fill="#666666"/>
  <rect x="6.5" y="10.3" width="3" height="0.5" rx="0.2" fill="#999999"/>
</svg>